# Lint and tests on every push to main and every pull request (Dependabot's
# included). The same commands as CLAUDE.md "Commands"; no test touches the
# network or needs data/ (fixtures only).

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes

      # setup-uv publishes no major tags since v8: pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install (Python from .python-version, locked, with dev tools)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Python tests
        run: uv run pytest

      # The runner image ships Node; the tests use only node:test.
      - name: JS tests
        run: node --test web/test/
