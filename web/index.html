<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEPTA Detours</title>
    <meta
      name="description"
      content="A map of SEPTA bus, trolley and rail detours in effect now, updated every 15 minutes. Unofficial: not affiliated with SEPTA."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- MapLibre GL JS, pinned to an exact version. Stylesheet and script must match.
         Deliberately v5, not v6: v6 is ESM-only and starts its web worker
         from a separate file, which browsers refuse to load cross-origin
         from a CDN. v5's single UMD file bundles the worker and defines the
         global `maplibregl`. Moving to v6 means vendoring it into web/.
         `integrity`: the browser refuses a file whose hash differs from
         these (checked against jsDelivr's hashes of the same npm release),
         so a changed CDN file can't run here. A new version needs new ones:
         curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
      integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <aside id="sidebar">
      <!-- The mobile sheet's handle (hidden on wide screens): each tap
           steps peek -> half -> full -> peek. -->
      <button id="sheet-handle" type="button" aria-controls="sidebar"></button>
      <div id="status" role="status"></div>
      <!-- The overview's list, or one route's panel: main.js shows one. -->
      <div id="browse">
        <input
          id="search"
          type="search"
          placeholder="Search routes: 21, Market, owl"
          aria-label="Search routes"
          autocomplete="off"
        />
        <div id="mode-chips" role="group" aria-label="Show modes"></div>
        <nav id="route-list" aria-label="Routes"></nav>
      </div>
      <section id="route-panel" aria-labelledby="route-panel-title" hidden></section>
    </aside>
    <!-- Read out by screen readers when the focused route changes (polite:
         after what they're saying). Visually hidden, not display: none,
         which would silence it. -->
    <div id="announce" class="visually-hidden" aria-live="polite"></div>
    <div id="map"></div>
    <!-- Banners over the map's bottom middle (app.css .banner), so they
         show whatever the phone sheet's height. At most one shows: an
         error means nothing loaded, and the reload offer replaces the
         old-data warning. -->
    <div id="error" class="banner" role="alert"></div>
    <!-- Old data (format.staleNotice). -->
    <div id="stale" class="banner" role="status"></div>
    <!-- Newer detours are out (main.js asks every few minutes): a Reload
         button, filled in by main.js. -->
    <div id="update" class="banner" role="status"></div>

    <!-- type="module": strict mode, own scope (no accidental globals), and
         deferred until the HTML is parsed, so #map exists when it runs.
         Loaded after maplibre-gl.js, so the global `maplibregl` exists.
         main.js imports the other modules in js/. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
